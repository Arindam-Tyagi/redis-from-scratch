# Config for node 4 - Phase 6's first REPLICA. This is node1's replica.
#
# Note there's no cluster.self/cluster.nodes here at all - a replica
# doesn't participate in cluster slot routing (see Main.java's Phase 6
# comments for why), so those properties are simply irrelevant for it.

port=6382
wal.path=wal/node4.wal
snapshot.path=snapshots/node4.snapshot

# ===== Phase 6: replication role =====
role=replica

# Which primary this replica connects to and streams writes from.
#
# NOTE: unlike cluster.nodes' host (which has to be the vEthernet (WSL)
# adapter IP, because WSL's redis-cli needs to reach it), THIS connection
# is a Windows Java process connecting to ANOTHER Windows Java process -
# both node4 and node1 run directly on Windows, and this traffic never
# touches WSL at all. Plain 127.0.0.1 is correct and simplest here (and
# avoids an observed slow "cold start" delay when connecting to the
# vEthernet adapter IP from another Windows process instead).
master.host=127.0.0.1
master.port=6379
