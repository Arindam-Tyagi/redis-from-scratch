# Config for node 3 of our 3-node cluster.

port=6381
wal.path=wal/node3.wal
snapshot.path=snapshots/node3.snapshot

# ===== Phase 5: cluster topology =====
# Same cluster.nodes list as node1.properties/node2.properties - only
# cluster.self differs, since this file is for node3 itself.
#
# Uses the Windows host's vEthernet (WSL) adapter IP (172.19.224.1)
# rather than 127.0.0.1 - see node1.properties for the full explanation
# of why (in short: so redis-cli running inside WSL can actually follow
# a MOVED redirect to another node).
cluster.self=node3
cluster.nodes=node1:172.19.224.1:6379:0-5460,node2:172.19.224.1:6380:5461-10922,node3:172.19.224.1:6381:10923-16383
