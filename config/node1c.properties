# Config for node1c - the 3rd member of Shard 1's 3-node Raft group.
# See node1.properties for the full explanation of every key below -
# only the actual values differ per node.

port=6385
wal.path=wal/node1c.wal
snapshot.path=snapshots/node1c.snapshot

# Same shard identity as node1 and node1b - all 3 claim slots 0-5460.
cluster.self=node1
cluster.nodes=node1:172.19.224.1:6379:0-5460,node2:172.19.224.1:6380:5461-10922,node3:172.19.224.1:6381:10923-16383

raft.self=node1c
raft.port=7385
raft.peers=node1:127.0.0.1:7379,node1b:127.0.0.1:7382
