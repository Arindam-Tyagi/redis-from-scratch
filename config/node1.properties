# Config for node1 - a member of Shard 1's 3-node Raft group (Phase 7).
# Shard 1 owns slots 0-5460. The other 2 members of this SAME shard are
# node1b and node1c (see their config files) - together, these 3
# processes replicate each other's writes via Raft consensus instead of
# Phase 6's primary/replica model.

port=6379
wal.path=wal/node1.wal
snapshot.path=snapshots/node1.snapshot

# ===== Phase 5: cluster topology (slot ownership) =====
# cluster.self=node1 here, AND on node1b.properties, AND on
# node1c.properties too - all 3 members of a shard claim the SAME slot
# ownership, because slot ownership is a property of the SHARD, not of
# any one process within it. This is a deliberate, separate concept from
# Raft LEADERSHIP (which one of the 3 is currently allowed to accept
# writes) - CommandProcessor's "do I own this slot" check (unchanged
# since Phase 5) still just answers "is my shard responsible for this
# key", regardless of which shard member happens to be leader right now.
#
# cluster.nodes still names exactly ONE representative host:port per
# shard (node1/node2/node3, the "a" member of each) for cross-shard
# MOVED redirects - a known simplification: if that specific process is
# down, or isn't the current Raft leader, a client's initial guess will
# fail and needs a smarter retry. That retry logic is Main.java's job,
# still to come.
cluster.self=node1
cluster.nodes=node1:172.19.224.1:6379:0-5460,node2:172.19.224.1:6380:5461-10922,node3:172.19.224.1:6381:10923-16383

# ===== Phase 7: Raft group membership =====
# raft.self is THIS node's unique id within its 3-node Raft group - the
# selfId passed to both RaftNode and RaftTransport. Note this is a
# DIFFERENT id space from cluster.self above (which is shared by all 3
# shard members) - raft.self must be unique per process.
#
# raft.port is a SEPARATE port from the client-facing `port` above,
# dedicated purely to Raft peer-to-peer RPC traffic (RequestVote /
# AppendEntries) - see RaftTransport.java's class comment for why these
# must never share a port.
#
# raft.peers lists the OTHER 2 members of THIS shard as id:host:port
# triples, comma-separated - exactly what Main.java will feed into
# RaftTransport's peers map. Plain 127.0.0.1 is correct here (not the
# vEthernet IP) because this traffic is Windows-process-to-Windows-
# process, the same reasoning as Phase 6's master.host.
raft.self=node1
raft.port=7379
raft.peers=node1b:127.0.0.1:7382,node1c:127.0.0.1:7385
