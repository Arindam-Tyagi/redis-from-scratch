# Config for node 1 of our 3-node cluster.
# java.util.Properties reads this as simple key=value pairs; lines starting
# with # are comments and are ignored.

port=6379
wal.path=wal/node1.wal
snapshot.path=snapshots/node1.snapshot

# ===== Phase 5: cluster topology =====
# cluster.self says which entry in cluster.nodes below is THIS server.
# cluster.nodes is the SAME on all three node*.properties files - it
# describes the whole cluster's layout (id:host:port:slotStart-slotEnd),
# comma-separated. Only cluster.self differs between the three files.
#
# NOTE ON THE HOST ADDRESS: this uses the Windows host's vEthernet (WSL)
# adapter IP (172.19.224.1) instead of 127.0.0.1. That's because when a
# client running INSIDE WSL (like redis-cli) follows a MOVED redirect, it
# has to reach the Java server over the network - and from WSL's point of
# view, "127.0.0.1" means WSL's OWN loopback, not the Windows machine
# where these servers actually run. This IP is the same one you already
# used to make your very first redis-cli connection work back in Phase 3
# - if it ever changes (e.g. after a reboot), re-check it with
# `ipconfig` on Windows and update it here in all three config files.
cluster.self=node1
cluster.nodes=node1:172.19.224.1:6379:0-5460,node2:172.19.224.1:6380:5461-10922,node3:172.19.224.1:6381:10923-16383
