# Config for node 2 of our 3-node cluster.

port=6380
wal.path=wal/node2.wal
snapshot.path=snapshots/node2.snapshot

# ===== Phase 6: replication role =====
# role defaults to "primary" if absent - written explicitly here for
# clarity. node5.properties is this node's replica.
role=primary

# ===== Phase 5: cluster topology =====
# Same cluster.nodes list as node1.properties/node3.properties - only
# cluster.self differs, since this file is for node2 itself.
#
# Uses the Windows host's vEthernet (WSL) adapter IP (172.19.224.1)
# rather than 127.0.0.1 - see node1.properties for the full explanation
# of why (in short: so redis-cli running inside WSL can actually follow
# a MOVED redirect to another node).
cluster.self=node2
cluster.nodes=node1:172.19.224.1:6379:0-5460,node2:172.19.224.1:6380:5461-10922,node3:172.19.224.1:6381:10923-16383
