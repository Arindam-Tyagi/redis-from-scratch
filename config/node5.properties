# Config for node 5 - this is node2's replica.

port=6383
wal.path=wal/node5.wal
snapshot.path=snapshots/node5.snapshot

# ===== Phase 6: replication role =====
role=replica

# See node4.properties for why this is 127.0.0.1, not the vEthernet
# (WSL) adapter IP - this connection is Windows-process-to-Windows-
# process and never touches WSL.
master.host=127.0.0.1
master.port=6380
